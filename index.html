<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Golf Round Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Golf Round Tracker</h1>

        <p>Track your round and see where you are losing strokes.</p>

        <section>
            <h2>Round</h2>
            <div id="holes-container"></div>

            <button id="calculate-button" type="button">
                Calculate Round
            </button>
        </section>

        <section>
            <h2>Result</h2>
            <p id="result">Enter your score to see the result.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
