<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Golf Round Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header class="app-header">
            <h1>Golf Round Tracker</h1>
            <p>By: Noah Riedl</p>
        </header>

        <section id="setup-section">
            <h2>Start a Round</h2>

            <label for="course-select">Course</label>

            <select id="course-select">
                <option value="standard">
                    Default Par 72 Course
                </option>

                <option value="practice">
                    Practice Course
                </option>
            </select>

            <button id="start-round-button" type="button">
                Start Round
            </button>

            <button
                id="resume-round-button"
                class="secondary-button hidden"
                type="button"
            >
                Resume Round
            </button>

            <button
                id="history-button"
                class="secondary-button"
                type="button"
            >
                Round History
            </button>
        </section>

        <section id="history-section" class="hidden">
            <div class="section-heading">
                <div>
                    <h2>Round History</h2>
                    <p id="history-count" class="section-subtitle"></p>
                </div>

                <button
                    id="history-back-button"
                    class="small-secondary-button"
                    type="button"
                >
                    Back
                </button>
            </div>

            <p id="empty-history-message" class="empty-state hidden">
                Finish your first round to see it here.
            </p>

            <div id="history-list"></div>
        </section>

        <section id="round-section" class="hidden">
            
            <div class="progress-row">
                <span id="hole-progress">Hole 1 of 18</span>
                <span id="course-name"></span>
            </div>

            <div class="progress-track">
                <div id="progress-bar"></div>
            </div>

<div class="round-status">
    <div>
        <span class="status-label">Hole</span>
        <strong id="hole-number">1</strong>
    </div>

    <div>
        <span class="status-label">Par</span>
        <strong id="hole-par">4</strong>
    </div>

    <div>
        <span class="status-label">Yards</span>
        <strong id="hole-yardage">375</strong>
    </div>
</div> 

            <div class="score-summary">
                <span>Current Score</span>
                <strong id="current-score">Even</strong>
            </div>


            <div class="input-group">
    <label for="score-input">Score</label>

    <div class="number-control">
        <button
            id="score-minus-button"
            class="number-button"
            type="button">
            -
        </button>

        <input
            id="score-input"
            type="number"
            min="1"
        >

        <button
            id="score-plus-button"
            class="number-button"
            type="button">
            +
        </button>
    </div>
</div>


            <div class="input-group">
    <label for="putts-input">Putts</label>

    <div class="number-control">
        <button
            id="putts-minus-button"
            class="number-button"
            type="button"
        >
            −
        </button>

        <input
            id="putts-input"
            type="number"
            min="0"
        >

        <button
            id="putts-plus-button"
            class="number-button"
            type="button"
        >
            +
        </button>
    </div>
</div>

            <div class="input-group" id="fairway-group">
                <label for="fairway-input">Fairway</label>

                <select id="fairway-input">
                    <option value="">Select result</option>
                    <option value="hit">Hit</option>
                    <option value="left">Missed Left</option>
                    <option value="right">Missed Right</option>
                    <option value="na">Not Applicable</option>
                </select>
            </div>

            <div class="input-group">
    <label for="penalties-input">
        Penalty Strokes
    </label>

    <div class="number-control">
        <button
            id="penalties-minus-button"
            class="number-button"
            type="button"
        >
            −
        </button>

        <input
            id="penalties-input"
            type="number"
            min="0"
            value="0"
        >

        <button
            id="penalties-plus-button"
            class="number-button"
            type="button"
        >
            +
        </button>
    </div>
</div>

            <p id="message" class="message"></p>

            <div class="navigation-buttons">
                <button id="previous-button" type="button">
                    Previous
                </button>

                <button id="next-button" type="button">
                    Save & Next
                </button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
